name: React App CI/CD for AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Compile React Production Build
        run: npm run build

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/ # Change to 'dist/' if you use Vite instead of Create React App

  deploy:
    needs: build-and-compile
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Navigate to your project root folder
            cd /var/www/smart-todo-ai/smart-todo-ai

            # 2. Pull the latest code updates
            git pull origin main

            # 3. Clean install application packages
            npm install

            # 4. Compile on the server to keep your local directory structured
            npm run build

            # 5. Serve the static build folder using PM2 on port 3000
            pm2 delete app || true
            pm2 serve build 3000 --name "app" --spa
